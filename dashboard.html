
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pune Waterlogging WebGIS Dashboard</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            font-size: 1.3rem;
        }

        header p {
            margin: 4px 0 0;
            font-size: 0.85rem;
            color: #dbeafe;
        }

        .report-btn {
            background: #f97316;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .report-btn:hover {
            background: #ea580c;
        }

        #map {
            flex: 1;
            width: 100%;
            min-height: 0;
        }

        /* Map legend */
        .legend {
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            font-size: 12px;
            line-height: 20px;
            max-width: 220px;
        }

        .legend h4 {
            margin: 0 0 8px;
            font-size: 13px;
            color: #1f4e79;
        }

        .legend i {
            width: 14px;
            height: 14px;
            float: left;
            margin-right: 8px;
            margin-top: 3px;
            border-radius: 50%;
            opacity: 0.85;
        }

        .legend-ahp i {
            border-radius: 2px;
        }

        /* Citizen report popup images, if used */
        .popup-img {
            width: 100%;
            max-width: 220px;
            border-radius: 6px;
            margin-top: 8px;
            display: block;
            border: 1px solid #e2e8f0;
        }

        /* Mobile layout */
        @media (max-width: 600px) {
            header {
                padding: 10px 12px;
                align-items: flex-start;
            }

            header h1 {
                font-size: 1rem;
            }

            header p {
                font-size: 0.75rem;
            }

            .report-btn {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1>🌊 Pune Waterlogging WebGIS Dashboard</h1>
            <p>Citizen Science &amp; AHP Susceptibility Integration</p>
        </div>

        <a href="index.html" class="report-btn">
            + Submit New Report
        </a>
    </header>

    <!-- Interactive map -->
    <div id="map"></div>

    <!-- Leaflet JavaScript: load before map.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Dashboard map logic: includes AHP, LULC, DEM and citizen reports -->
    <script src="js/map.js"></script>

</body>
</html>
